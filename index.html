<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Washington, DC Map</title>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .title {
      position: absolute;
      z-index: 1;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: white;
      border-radius: 4px;
      font: 16px/1.2 sans-serif;
      box-shadow: 0 1px 4px rgb(0 0 0 / 25%);
    }
  </style>
</head>
<body>
  <div class="title">Washington, DC area</div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      //style: 'https://demotiles.maplibre.org/style.json',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-77.0369, 38.9072], // longitude, latitude
      zoom: 8
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    new maplibregl.Marker({ color: '#d33' })
      .setLngLat([-77.0369, 38.9072])
      .setPopup(
        new maplibregl.Popup({ offset: 25 })
          .setHTML('<strong>Washington, DC</strong>')
      )
      .addTo(map);
  </script>
</body>
</html>
